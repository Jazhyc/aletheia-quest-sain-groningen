# Local smoke-test configuration. The real leaderboard uses its own dataset list.
#
# Keep this to one representative varied-deception unit: each entry launches the
# submission notebook independently, so a large list repeats remote model startup
# even when `submit.py --dry --limit 1` is used.

notebook_timeout: 1200

datasets:
  - name: aletheias-quest/dev-varied-deception-Qwen3.5-27B-None
    labels_uri: aletheias-quest/dev-varied-deception-Qwen3.5-27B-None-labels
    id_column: index
    label_column: deceptive
