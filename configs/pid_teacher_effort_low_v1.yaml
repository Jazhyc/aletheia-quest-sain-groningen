# @package _global_
# Low-effort GPT-OSS teacher, holding the selected varied-only SFT recipe fixed.

defaults:
  - privileged_information_distillation
  - _self_

method: qwen9b_pid_varied_teacher_effort_low_adamw5e5_v1

teacher:
  reasoning_effort: low
  dataset_name_contains: varied-deception
  artifact: ${output_dir}/teacher/train.jsonl

student:
  dataset_name_contains: varied-deception
  output_dir: ${output_dir}/adapter
  training:
    optimizer: adamw
    optim: adamw_torch
    learning_rate: 5.0e-5
    num_train_epochs: 1.0
