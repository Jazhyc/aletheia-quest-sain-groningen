# @package _global_
# Full-data matched rank-24 ablation of the selected varied-only PID recipe.

defaults:
  - privileged_information_distillation
  - _self_

method: qwen9b_pid_varied_rank24_full_adamw5e5_v1

student:
  dataset_name_contains: varied-deception
  train_fraction: 1.0
  train_fraction_seed: ${seed}
  output_dir: ${output_dir}/adapter
  lora:
    # Preserve the selected recipe's alpha/r = 2 scaling.
    r: 24
    alpha: 48
  training:
    optimizer: adamw
    optim: adamw_torch
    learning_rate: 5.0e-5
    num_train_epochs: 1.0
