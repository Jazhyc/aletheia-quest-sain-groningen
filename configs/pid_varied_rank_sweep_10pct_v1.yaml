# @package _global_
# Fast matched LoRA-rank screen on the selected varied-only PID recipe.

defaults:
  - privileged_information_distillation
  - _self_

method: qwen9b_pid_varied_rank1_datafrac10_adamw5e5_v1

student:
  dataset_name_contains: varied-deception
  train_fraction: 0.10
  train_fraction_seed: ${seed}
  output_dir: ${output_dir}/adapter
  lora:
    # Override both fields together; keep alpha/r = 2 across the sweep.
    r: 1
    alpha: 2
  training:
    optimizer: adamw
    optim: adamw_torch
    learning_rate: 5.0e-5
    num_train_epochs: 1.0
