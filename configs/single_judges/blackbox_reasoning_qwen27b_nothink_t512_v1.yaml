# @package _global_
# Matched Qwen3.5-27B version of the regular 512-token no-thinking judge.

defaults:
  - /blackbox_reasoning
  - _self_

method: qwen27b_reason_nothink_t512_v1

judge:
  model: Qwen/Qwen3.5-27B
  served_model: qwen27b-judge
  use_chat_template: true
  enable_thinking: false
  max_model_len: 8192
  max_num_seqs: 512
  tensor_parallel_size: 1
  max_tokens: 512
  max_prompt_chars: 8000
