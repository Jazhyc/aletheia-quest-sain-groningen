# @package _global_
# Single-judge generation run that disables Qwen's native thinking template and
# caps generation tightly to test whether the existing prompt can fit.

defaults:
  - /blackbox_reasoning
  - _self_

method: qwen_reason_nothink_t128_v1

judge:
  use_chat_template: true
  enable_thinking: false
  max_tokens: 128
