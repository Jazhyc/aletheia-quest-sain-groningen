# @package _global_
# Common rank-1 recipe for genuine, ground-truth-blind teacher distillation.

defaults:
  - privileged_information_distillation
  - _self_

teacher:
  uses_ground_truth: false
  dataset_name_contains: varied-deception
  selection_manifest: results/blackbox/qwen9b_blind_teacher_ensemble_rank1_v1/raw_train10.jsonl

student:
  dataset_name_contains: varied-deception
  require_teacher_label_match: false
  train_fraction: 1.0
  selection_manifest: results/blackbox/qwen9b_blind_teacher_ensemble_rank1_v1/common_parsed_train.jsonl
  output_dir: ${output_dir}/adapter
  lora: {r: 1, alpha: 2}
  training:
    optimizer: adamw
    optim: adamw_torch
    learning_rate: 5.0e-5
    num_train_epochs: 1.0
