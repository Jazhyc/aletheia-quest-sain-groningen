# @package _global_
defaults:
  - privileged_information_distillation
  - _self_

method: qwen9b_pid_family_coverage_varied10_adamw5e5_v1

student:
  train_fraction: 1.0
  teacher_sources:
    - artifact: results/blackbox/qwen9b_privileged_gptoss120b_summary_v1/teacher/train.jsonl
      dataset_name_contains: varied-deception
      train_fraction: 0.10
      train_fraction_seed: ${seed}
    - artifact: results/blackbox/qwen9b_privileged_gptoss120b_summary_v1/teacher/train.jsonl
      dataset_name_contains: instructed-deception-gemma
      train_fraction: 0.10
      train_fraction_seed: ${seed}
    - artifact: results/blackbox/qwen9b_privileged_gptoss120b_summary_v1/teacher/train.jsonl
      dataset_name_contains: instructed-deception-NVIDIA-Nemotron
      train_fraction: 0.10
      train_fraction_seed: ${seed}
  output_dir: ${output_dir}/adapter
  training:
    optimizer: adamw
    optim: adamw_torch
    learning_rate: 5.0e-5
    num_train_epochs: 1.0
