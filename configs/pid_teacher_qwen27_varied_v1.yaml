# @package _global_
# Same-family Qwen-27B privileged teacher with the selected Qwen-9B SFT recipe.

defaults:
  - privileged_information_distillation
  - _self_

method: qwen9b_pid_varied_teacher_qwen27_adamw5e5_v1

teacher:
  model: Qwen/Qwen3.5-27B
  served_model: qwen27-teacher
  output_format: qwen_think
  dataset_name_contains: varied-deception
  artifact: ${output_dir}/teacher/train.jsonl
  # The private thinking channel is never copied into the student target.
  max_tokens: 2048
  max_model_len: 8192
  tensor_parallel_size: 1
  max_num_seqs: 64
  enable_prefix_caching: true

student:
  dataset_name_contains: varied-deception
  train_fraction: 1.0
  output_dir: ${output_dir}/adapter
  training:
    optimizer: adamw
    optim: adamw_torch
    learning_rate: 5.0e-5
    num_train_epochs: 1.0
