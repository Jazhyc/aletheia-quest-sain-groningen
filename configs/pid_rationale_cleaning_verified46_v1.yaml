# @package _global_
# Replace only manually verified bad rationales with label-only targets.

defaults:
  - privileged_information_distillation
  - _self_

method: qwen9b_pid_rationale_cleaning_verified46_variedonly_adamw5e5_v1

student:
  dataset_name_contains: varied-deception
  label_only_manifest: experiments/privileged_information_distillation/manifests/rationale_cleaning_verified46_v1.jsonl
  train_fraction: 1.0
  train_fraction_seed: ${seed}
  output_dir: ${output_dir}/adapter
  training:
    optimizer: adamw
    optim: adamw_torch
    learning_rate: 5.0e-5
    num_train_epochs: 1.0
