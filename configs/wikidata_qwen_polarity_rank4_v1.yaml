# @package _global_
defaults:
  - privileged_information_distillation
  - _self_

method: wikidata_qwen_polarity_rank4_v1
output_dir: results/blackbox/${method}

teacher:
  artifact: ${output_dir}/teacher/train_pairs.jsonl

student:
  target_mode: teacher
  require_teacher_label_match: true
  dataset_name_contains: null
  selection_manifest: null
  train_fraction: 1.0
  max_length: 1024
  output_dir: ${output_dir}/adapter
  lora:
    r: 4
    alpha: 8
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  training:
    optimizer: adamw
    optim: adamw_torch
    learning_rate: 5.0e-5
    num_train_epochs: 1.0
    max_steps: -1
    warmup_ratio: 0.03
    weight_decay: 0.0
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 16
    logging_steps: 1
    direct_loss_weight: 1.0
    pairwise_loss_weight: 1.0
    pairwise_temperature: 1.0
    paired_batching: true
